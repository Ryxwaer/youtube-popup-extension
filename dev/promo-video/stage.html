<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url('fonts/InterVariable.ttf'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; color: #fff; font-feature-settings: 'cv11', 'ss01'; }

  #bg { position: absolute; inset: 0;
    background:
      radial-gradient(60% 55% at 50% 58%, rgba(255, 52, 64, .20), transparent 70%),
      radial-gradient(40% 40% at 18% 20%, rgba(120, 60, 255, .10), transparent 70%),
      radial-gradient(45% 45% at 85% 85%, rgba(255, 120, 60, .08), transparent 70%),
      linear-gradient(#0b0b0f, #050507); }

  #caption { position: absolute; left: 0; right: 0; top: 34px; height: 64px; text-align: center;
    font-size: 46px; font-weight: 650; letter-spacing: -0.025em; line-height: 64px; white-space: nowrap; }
  #caption span { display: inline-block; }
  #caption .dim { color: rgba(255, 255, 255, .55); }

  /* Device: 1194 x 834 screen in device units, scaled to fit. */
  #device { position: absolute; left: 50%; top: 122px; width: 1327px; height: 940px; margin-left: -663.5px;
    border-radius: 54px; background: #0c0c0e;
    box-shadow: 0 0 0 2px #2a2a2e, 0 0 0 3.5px #0a0a0b, inset 0 0 0 1px rgba(255,255,255,.06),
      0 50px 120px rgba(0, 0, 0, .65), 0 18px 40px rgba(0, 0, 0, .5); }
  #camera { position: absolute; left: 50%; top: 9px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #2b3550, #0b0d14 60%); }
  #screen { position: absolute; left: 22px; top: 22px; width: 1194px; height: 834px; border-radius: 20px; overflow: hidden;
    transform-origin: 0 0; background: #000; }

  /* Browser chrome (dark). */
  #status { height: 24px; background: #121214; display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px 0 26px; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; color: #f2f2f4; }
  #status .r { display: flex; gap: 7px; align-items: center; }
  #tabs { height: 40px; background: #121214; display: flex; align-items: flex-end; padding: 0 10px; gap: 2px; }
  .tab { position: relative; width: 236px; height: 34px; border-radius: 11px 11px 0 0; display: flex; align-items: center;
    gap: 9px; padding: 0 12px 0 14px; font-size: 12.5px; font-weight: 500; color: #a9a9ae; }
  .tab.on { background: #26262b; color: #f2f2f4; }
  .tab:not(.on) + .tab:not(.on)::before { content: ''; position: absolute; left: -1px; top: 9px; bottom: 9px; width: 1px; background: #3a3a40; }
  .tab .fav { width: 16px; height: 16px; flex: none; border-radius: 3px; }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { width: 16px; height: 16px; flex: none; opacity: .7; }
  .tab.on::after, .tab.on::before { content: ''; position: absolute; bottom: 0; width: 11px; height: 11px; }
  .tab.on::before { left: -11px; background: radial-gradient(circle at 0 0, transparent 11px, #26262b 11.5px); }
  .tab.on::after { right: -11px; background: radial-gradient(circle at 100% 0, transparent 11px, #26262b 11.5px); }
  #newtab { width: 32px; height: 32px; display: grid; place-items: center; margin-bottom: 1px; opacity: .75; }
  #bar { height: 42px; background: #26262b; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 8px;
    border-bottom: 1px solid #000; }
  .ib { width: 34px; height: 34px; display: grid; place-items: center; color: #c9c9ce; }
  .ib.dis { opacity: .35; }
  #url { flex: 1; height: 32px; margin: 0 8px; border-radius: 16px; background: #131316; display: flex; align-items: center;
    gap: 10px; padding: 0 14px; font-size: 14px; color: #8e8e94; white-space: nowrap; overflow: hidden; }
  #url b { font-weight: 500; color: #f2f2f4; }
  #url .u { overflow: hidden; text-overflow: ellipsis; }
  #ext { width: 22px; height: 22px; border-radius: 5px; }
  #page { position: absolute; left: 0; top: 106px; width: 1194px; height: 728px; display: block; object-fit: fill; background: #1a1a1a; }

  .touch { position: absolute; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.62), rgba(255,255,255,.42) 65%, rgba(255,255,255,.3));
    box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 0 3.5px rgba(0,0,0,.28), 0 6px 20px rgba(0,0,0,.4); pointer-events: none; }

  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5, 5, 8, .62); backdrop-filter: blur(26px) saturate(1.2); }
  #end img { width: 168px; height: 168px; filter: drop-shadow(0 20px 40px rgba(0,0,0,.5)); }
  #end h1 { margin-top: 34px; font-size: 92px; font-weight: 750; letter-spacing: -0.035em; }
  #end p { margin-top: 10px; font-size: 36px; font-weight: 500; letter-spacing: -0.015em; color: rgba(255,255,255,.72); }
  #end .pill { margin-top: 42px; padding: 14px 30px; border-radius: 999px; font-size: 24px; font-weight: 600;
    background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); color: #f2f2f4; }

  /* Store screenshot layout (stage.html#shot): 1280 x 800, one-line caption. */
  html.shot, html.shot body { width: 1280px; height: 800px; }
  html.shot #caption { top: 22px; height: 52px; line-height: 52px; font-size: 34px; }
  html.shot #device { top: 92px; border-radius: 40px; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="caption"></div>
<div id="device">
  <div id="camera"></div>
  <div id="screen">
    <div id="status">
      <span>9:41&nbsp;&nbsp;<span style="font-weight:500">Fri Nov 6</span></span>
      <span class="r">
        <svg width="17" height="12" viewBox="0 0 17 12"><path fill="#f2f2f4" d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5l1.2-1.2C14 1.6 11.4.6 8.5.6S3 1.6 1 3.6l1.2 1.2c1.7-1.6 3.9-2.5 6.3-2.5zm0 3.4c1.5 0 2.8.5 3.9 1.5l1.2-1.2C12.2 4.7 10.4 4 8.5 4S4.8 4.7 3.4 6l1.2 1.2c1.1-1 2.4-1.5 3.9-1.5zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.2 7 9.7c.4-.4.9-.6 1.5-.6z"/></svg>
        <span style="font-weight:500">92%</span>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#f2f2f4" stroke-opacity=".45"/><rect x="2" y="2" width="18.5" height="9" rx="2" fill="#f2f2f4"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#f2f2f4" fill-opacity=".45"/></svg>
      </span>
    </div>
    <div id="tabs">
      <div class="tab" id="tab-yt"><img class="fav"><span class="t"></span><svg class="x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7m0-7l-7 7" stroke="#c9c9ce" stroke-width="1.4" stroke-linecap="round"/></svg></div>
      <div class="tab" id="tab-claude"><img class="fav"><span class="t"></span><svg class="x" viewBox="0 0 16 16"><path d="M4.5 4.5l7 7m0-7l-7 7" stroke="#c9c9ce" stroke-width="1.4" stroke-linecap="round"/></svg></div>
      <div id="newtab"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11" stroke="#d6d6da" stroke-width="1.6" stroke-linecap="round"/></svg></div>
    </div>
    <div id="bar">
      <div class="ib"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M15 9H3.5m5-5L3.5 9l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="ib dis"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9h11.5m-5-5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="ib"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9M14.5 3v3.5H11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div id="url">
        <svg width="14" height="14" viewBox="0 0 14 14" style="flex:none"><rect x="2.5" y="6" width="9" height="6.5" rx="1.6" fill="#9a9aa0"/><path d="M4.5 6V4.6a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="#9a9aa0" stroke-width="1.4"/></svg>
        <span class="u"></span>
      </div>
      <div class="ib"><img id="ext"></div>
      <div class="ib"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="3.8" r="1.4" fill="currentColor"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="14.2" r="1.4" fill="currentColor"/></svg></div>
    </div>
    <img id="page">
    <div id="touches"></div>
  </div>
</div>
<div id="end">
  <img id="end-icon">
  <h1>PiP Anywhere</h1>
  <p>A floating player for YouTube, on every tab.</p>
  <div class="pill">Free on the Chrome Web Store</div>
</div>
<script>
  const $ = (s) => document.querySelector(s);
  const screenEl = $('#screen');
  const SHOT = location.hash === '#shot';
  if (SHOT) document.documentElement.classList.add('shot');
  const DEVICE_H = SHOT ? 692 : 940;
  const SCALE = (DEVICE_H - 44) / 834;
  $('#device').style.height = `${DEVICE_H}px`;
  screenEl.style.transform = `scale(${SCALE})`;
  $('#device').style.width = `${1194 * SCALE + 44}px`;
  $('#device').style.marginLeft = `${-(1194 * SCALE + 44) / 2}px`;
  let lastSrc = '';
  window.setup = (s) => {
    $('#tab-yt .fav').src = s.tabs.yt.icon;
    $('#tab-claude .fav').src = s.tabs.claude.icon;
    $('#ext').src = s.icon;
    $('#end-icon').src = s.icon;
  };
  window.draw = async (s) => {
    for (const k of ['yt', 'claude']) {
      $(`#tab-${k}`).classList.toggle('on', s.tab === k);
      $(`#tab-${k} .t`).textContent = s.titles[k];
    }
    const u = new URL(s.url);
    $('#url .u').innerHTML = `<b>${u.host.replace(/^www\./, '')}</b>${(u.pathname + u.search).replace(/^\/$/, '')}`;
    $('#touches').innerHTML = s.touches
      .map((t) => `<div class="touch" style="left:${t.x}px;top:${t.y + 106}px;opacity:${t.o};transform:scale(${t.s})"></div>`)
      .join('');
    const c = $('#caption');
    if (c.dataset.text !== s.caption.text) {
      c.dataset.text = s.caption.text;
      c.innerHTML = s.caption.text ? s.caption.text.replace(/\{(.*?)\}/g, '<span class="dim">$1</span>') : '';
    }
    c.style.opacity = s.caption.o;
    c.style.transform = `translateY(${(1 - s.caption.o) * 10}px)`;
    const e = $('#end');
    e.style.opacity = s.end;
    e.style.display = s.end > 0 ? 'flex' : 'none';
    e.firstElementChild.style.transform = `scale(${0.92 + 0.08 * s.end})`;
    if (s.frame !== lastSrc) {
      lastSrc = s.frame;
      const img = $('#page');
      img.src = s.frame;
      await img.decode();
    }
  };
</script>
</body>
</html>
